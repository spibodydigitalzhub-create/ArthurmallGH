<section class="section">
  <div class="section-title">
    <span></span>
    <h2>CHECKOUT</h2>
    <span></span>
  </div>

  <div class="checkout-grid">
    <div class="checkout-form-box">
      <h3>Customer Information</h3>

      <form id="checkoutForm" class="checkout-form">
        <div class="form-group">
          <label for="customerName">Full Name</label>
          <input type="text" id="customerName" required />
        </div>

        <div class="form-group">
          <label for="customerPhone">Phone Number</label>
          <input type="tel" id="customerPhone" required />
        </div>

        <div class="form-group">
          <label for="customerAddress">Address</label>
          <textarea id="customerAddress" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="customerNote">Extra Note</label>
          <textarea id="customerNote" rows="3"></textarea>
        </div>

        <button type="submit" class="btn checkout-submit-btn">Place Order on WhatsApp</button>
      </form>
    </div>

    <div class="checkout-summary-box">
      <h3>Order Summary</h3>
      <div id="checkoutItems" class="checkout-items"></div>
      <div class="summary-row">
        <span>Total Items:</span>
        <strong id="checkoutTotalItems">0</strong>
      </div>
      <div class="summary-row">
        <span>Total Price:</span>
        <strong id="checkoutTotalPrice">₵0</strong>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-content">
    <img class="footer-logo" src="https://i.imgur.com/YEgotE7.png" alt="ArthurmallGh logo" />
