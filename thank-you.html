<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Arthur Mall GH</title>
    
    <!-- ========================================== -->
    <!-- ⚠️ REPLACE 'YOUR_PIXEL_ID_HERE' WITH YOUR ACTUAL META PIXEL ID ⚠️ -->
    <!-- ========================================== -->
    
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'YOUR_PIXEL_ID_HERE'); 
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID_HERE&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
        }
        .success-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background-color: #e6f4ea;
            color: #1e7e34;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
            font-weight: bold;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            color: #202124;
        }
        p {
            margin: 0 0 30px;
            color: #5f6368;
            line-height: 1.6;
            font-size: 16px;
        }
        .btn-home {
            display: inline-block;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1>Order Confirmed!</h1>
        <p>Thank you for your order. Please check your WhatsApp to complete the chat with our team.</p>
        <a href="index.html" class="btn-home">Continue Shopping</a>
    </div>

    <!-- ========================================== -->
    <!-- THIS IS THE CODE THAT FIRES THE PURCHASE EVENT -->
    <!-- ========================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Get the product data from localStorage
            const singleProduct = JSON.parse(localStorage.getItem("arthurmallghCheckoutProduct"));

            // 2. Fire the Purchase event ONLY if we have product data and the Pixel is loaded
            if (singleProduct && typeof fbq !== "undefined") {
                
                fbq("track", "Purchase", {
                    content_name: singleProduct.name,
                    content_type: "product",
                    value: Number(singleProduct.price),
                    currency: "GHS"
                });

                // 3. Clear the cart so the event doesn't fire again if they refresh the page
                localStorage.removeItem("arthurmallghCheckoutProduct");
                
                console.log("✅ Purchase event fired successfully for:", singleProduct.name);
            }
        });
    </script>

</body>
</html>
